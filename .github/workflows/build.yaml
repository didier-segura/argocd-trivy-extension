name: build
on: 
    workflow_dispatch:
    push:
        branches:
            - 'main'
            - 'backport-forks'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--no-deprecation"
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm run build